[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "novabot913"
version = "0.1.0"
description = "Causal production implementation of frozen Strategy 913"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/novabot913"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [
  "reference/strategy913",
  "scripts/run_strategy913_ablation.py",
  "scripts/run_strategy913_ytd_protect.py",
  "scripts/run_strategy913r1_reference.py",
  "scripts/run_strategy913r1_ytd.py",
  "src/novabot913/strategy913r1_engine.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
