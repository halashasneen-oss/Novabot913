name: Additional canonical historical windows

on:
  push:
    branches:
      - build/strategy-913
    paths:
      - scripts/run_additional_canonical_windows.py
      - .github/workflows/additional-canonical-windows.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Run Strategy 913 on additional canonical windows
        run: python scripts/run_additional_canonical_windows.py
      - name: Upload additional canonical validation
        uses: actions/upload-artifact@v4
        with:
          name: additional-canonical-windows
          path: additional_canonical_windows.json
          if-no-files-found: error
          retention-days: 1
