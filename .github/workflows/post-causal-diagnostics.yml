name: Post-causal diagnostics

on:
  push:
    branches:
      - build/strategy-913
    paths:
      - "src/novabot913/post_causal_analysis.py"
      - "tests/test_post_causal_analysis.py"
      - "scripts/analyze_corrected_reference.py"
      - ".github/workflows/post-causal-diagnostics.yml"
  workflow_dispatch:

jobs:
  diagnostics:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Run frozen corrected reference
        run: python scripts/run_corrected_reference.py
      - name: Analyze corrected trades
        run: python scripts/analyze_corrected_reference.py
      - name: Upload post-causal diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: post-causal-diagnostics
          path: |
            corrected_causal_reference.json
            post_causal_diagnostics.json
          if-no-files-found: error
