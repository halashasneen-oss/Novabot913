name: One-time branch cleanup

on:
  push:
    branches:
      - build/strategy-913
    paths:
      - .github/workflows/one-time-branch-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - name: Delete obsolete branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for ref in \
            "research/strategy-913-aggressive-full-engine" \
            "research/strategy-913-risk-controlled-winner-add" \
            "validation/strategy-913-2025-01-01-to-2026-09-16" \
            "validation/strategy-913-aug-2026" \
            "validation/strategy-913-jul-2026" \
            "validation/strategy-913-jun-2026"
          do
            echo "Deleting $ref"
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/$ref"
          done
