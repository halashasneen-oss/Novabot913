name: Canonical trade audit

on:
  push:
    branches:
      - build/strategy-913
    paths:
      - scripts/run_canonical_trade_audit.py
      - .github/workflows/canonical-trade-audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        window:
          - apr_2026
          - may_2026
          - jun_jul_2026
          - jul_aug_2026
          - aug_sep_2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Audit canonical Strategy 913 trades
        run: python scripts/run_canonical_trade_audit.py "${{ matrix.window }}"
      - name: Upload trade audit
        uses: actions/upload-artifact@v4
        with:
          name: canonical-trade-audit-${{ matrix.window }}
          path: canonical_trade_audit_${{ matrix.window }}.json
          if-no-files-found: error
