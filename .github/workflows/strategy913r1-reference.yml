name: Strategy 913-R1 reference comparison

on:
  push:
    branches:
      - research/strategy-913-r1
    paths:
      - src/novabot913/strategy913r1.py
      - src/novabot913/strategy913r1_engine.py
      - scripts/run_strategy913r1_reference.py
      - .github/workflows/strategy913r1-reference.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        window:
          - apr_2026
          - may_2026
          - jun_jul_2026
          - jul_aug_2026
          - aug_sep_2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Run R1 comparison
        run: python scripts/run_strategy913r1_reference.py --window "${{ matrix.window }}"
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: strategy913r1-reference-${{ matrix.window }}
          path: strategy913r1_reference_${{ matrix.window }}.json
          if-no-files-found: error
          retention-days: 1
