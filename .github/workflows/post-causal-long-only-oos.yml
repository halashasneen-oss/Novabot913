name: Post-causal LONG-only OOS validation (archived)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Run archived frozen LONG-only OOS validation
        run: python scripts/run_post_causal_long_only_oos.py
      - name: Upload archived OOS validation
        uses: actions/upload-artifact@v4
        with:
          name: post-causal-long-only-oos
          path: post_causal_long_only_oos.json
          if-no-files-found: error
